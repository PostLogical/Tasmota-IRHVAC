reset_ff_seeds:
  description: Reset feedforward RLS models to seed values from config slopes. Also zeros the PI integral. Optionally reset only one mode.
  target:
    entity:
      integration: tasmota_irhvac
  fields:
    mode:
      description: Reset only this mode's RLS model (heat or cool). Omit to reset both.
      required: false
      selector:
        select:
          options:
            - heat
            - cool

suppress_ff_learning:
  description: Manually suppress feedforward auto-learning. Learning stays suppressed until resume_ff_learning is called or HA restarts.
  target:
    entity:
      integration: tasmota_irhvac
  fields:
    reason:
      description: Optional reason for suppression (shown in diagnostics and binary sensor attributes).
      example: "Testing new bias values"
      required: false
      selector:
        text:

resume_ff_learning:
  description: Resume feedforward auto-learning after manual suppression.
  target:
    entity:
      integration: tasmota_irhvac

diagnostic_dump:
  name: Diagnostic dump
  description: Write PI controller diagnostic data (observation buffer, RLS coefficients, integral state) to a JSON file for offline analysis.
  target:
    entity:
      integration: tasmota_irhvac

flush_observation_buffer:
  name: Flush observation buffer
  description: Clear observation buffer(s) and reset batch learning state. This is a destructive operation — accumulated observations, batch results, and drift correction history will be lost. Use after major renovation or equipment changes. Optionally flush only one mode's buffer.
  target:
    entity:
      integration: tasmota_irhvac
  fields:
    mode:
      description: Flush only this mode's observation buffer (heat or cool). Omit to flush both.
      required: false
      selector:
        select:
          options:
            - heat
            - cool

set_coefficient:
  name: Set coefficient
  description: Manually set an RLS feedforward coefficient value. The coefficient is identified by name (intercept, outdoor_delta, or model input name) and mode (heat/cool).
  target:
    entity:
      integration: tasmota_irhvac
  fields:
    mode:
      description: Which mode's RLS model to modify.
      required: true
      selector:
        select:
          options:
            - heat
            - cool
    name:
      description: Coefficient name (intercept, outdoor_delta, or a model input name).
      required: true
      example: "outdoor_delta"
      selector:
        text:
    value:
      description: New coefficient value in physical units.
      required: true
      example: 0.35
      selector:
        number:
          min: -20
          max: 20
          step: 0.01
          mode: box

freeze_coefficient:
  name: Freeze coefficient
  description: Freeze or unfreeze RLS learning for a specific coefficient. When frozen, the coefficient retains its current value and online learning skips it.
  target:
    entity:
      integration: tasmota_irhvac
  fields:
    mode:
      description: Which mode's RLS model to modify.
      required: true
      selector:
        select:
          options:
            - heat
            - cool
    name:
      description: Coefficient name (intercept, outdoor_delta, or a model input name).
      required: true
      example: "outdoor_delta"
      selector:
        text:
    frozen:
      description: True to freeze (stop learning), false to unfreeze (resume learning).
      required: true
      selector:
        boolean:

set_swingh:
  name: Set swingh
  description: Sets vane horizontal position.
  target:
    entity:
      integration: tasmota_irhvac
  fields:
    swingh:
      description: '"off", "auto", "left max", "left", "middle", "right", "right max" or "wide", but only those supported by this model.'
      example: '"middle"'
      required: true
      selector:
        select:
          options:
            - "off"
            - "auto"
            - "left max"
            - "left"
            - "middle"
            - "right"
            - "right max"
            - "wide"
    state_mode:
      description: Sets StateMode in MQTT message. Default is "SendStore".
      example: "StoreOnly"
      required: false
      selector:
        select:
          options:
            - StoreOnly
            - SendStore

perturb_now:
  name: Perturb now
  description: Request an immediate auto-perturbation cycle for plant identification. Bypasses the convergence-based frequency governor but still waits for steady-state conditions before stepping. Times out after 60 minutes if steady state is not reached.
  target:
    entity:
      integration: tasmota_irhvac

learning_reset:
  name: Learning reset
  description: Selectively reset learning subsystems. Choose which targets to reset — any combination of seeds, buffers, integral, plant_id, greybox. Mode param applies to seeds and buffers only.
  target:
    entity:
      integration: tasmota_irhvac
  fields:
    targets:
      description: Which subsystems to reset.
      required: true
      selector:
        select:
          multiple: true
          options:
            - seeds
            - buffers
            - integral
            - plant_id
            - greybox
    mode:
      description: Reset only this mode (heat or cool). Applies to seeds and buffers. Omit to reset both.
      required: false
      selector:
        select:
          options:
            - heat
            - cool

learning_save:
  name: Learning save
  description: Save current learning state (RLS coefficients, covariance, integral, frozen state) to a named snapshot slot. Max 3 slots.
  target:
    entity:
      integration: tasmota_irhvac
  fields:
    slot:
      description: Name for this snapshot slot.
      required: true
      example: "before_renovation"
      selector:
        text:

learning_restore:
  name: Learning restore
  description: Restore learning state from a previously saved snapshot slot.
  target:
    entity:
      integration: tasmota_irhvac
  fields:
    slot:
      description: Name of the snapshot slot to restore.
      required: true
      example: "before_renovation"
      selector:
        text:

set_subsystem:
  name: Set subsystem
  description: Toggle a PI subsystem on or off at runtime. No reload needed — takes effect on next tick. State persists across restarts. Use 'control' to enable/disable PI setpoint output (observe-only mode).
  target:
    entity:
      integration: tasmota_irhvac
  fields:
    subsystem:
      description: "Subsystem to toggle: control (PI output), ff (feedforward), rls_online (per-tick RLS), batch_wls (batch analysis), plant_id (τ estimation)."
      required: true
      selector:
        select:
          options:
            - control
            - ff
            - rls_online
            - batch_wls
            - plant_id
    enabled:
      description: Whether to enable (true) or disable (false) the subsystem.
      required: true
      selector:
        boolean:
