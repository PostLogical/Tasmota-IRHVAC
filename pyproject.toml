[tool.pytest.ini_options]
testpaths = ["tests"]
# --ignore=tests/hvac_bench: bench is opt-in (slow). Run with explicit path:
#   .venv/bin/pytest tests/hvac_bench/ -m "not slow and not design" -n auto
#     → default tier (~3:19 on 12 cores)
#   .venv/bin/pytest tests/hvac_bench/ -m "slow and not design" -n auto
#     → regression tier (~minutes)
#   .venv/bin/pytest tests/hvac_bench/ -m design -n auto
#     → design verdicts (long; @study deselected unless --run-studies)
#   .venv/bin/pytest tests/hvac_bench/ -m design --run-studies -n auto
#     → full design + study sweep (intrinsically slow per-cell sims)
#
# --dist=loadfile: keeps tests from the same file on the same xdist worker so
# module-scoped fixtures (seasonal_results, capacity_runs, _multi_year_result,
# variant_results, …) compute once per file instead of once per worker that
# picks up a test from that file. Trade-off: heavy files become a serial
# bottleneck within their worker (effective parallelism ≈ # of files with
# meaningful work, ~3 cores on the default tier as of 2026-05-08). Override
# for design-tier sweeps where each parametrized cell is independent and
# inter-cell fanout matters more than fixture amortization:
#   --override-ini='addopts=--dist=load'   (or --dist=worksteal)
#
# --store-durations: pytest-split merges each run's per-test durations into the
# committed .test_durations (continuous, near-zero-cost). Use it to estimate a
# run's wall-time (sum the scope ÷ workers) and as a regression tripwire
# (git diff .test_durations after a run). pytest-durations (also installed) is
# active by default for the live fixture-vs-test breakdown when diagnosing a jump.
addopts = "--ignore=tests/hvac_bench --dist=loadfile --store-durations --durations-path=.test_durations"
asyncio_mode = "auto"
log_format = "%(asctime)s %(levelname)-8s %(name)s: %(message)s"
log_date_format = "%H:%M:%S"
markers = [
    "slow: marks tests as slow (run with -m slow, deselect with -m 'not slow')",
    "design: design-time / verdict-in-memo / long-horizon studies (run with -m design, deselect with -m 'not design')",
    "study: ad-hoc verdict study, deselected by default. Opt in with --run-studies.",
]

[tool.mypy]
python_version = "3.14"
strict = false
warn_return_any = true
warn_unused_ignores = true
warn_unreachable = true
check_untyped_defs = true
disallow_incomplete_defs = true
exclude = [".venv", "tests"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
